<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNVIP88 - Cổng Game Đẳng Cấp Quốc Tế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f0c1b 0%, #1a103c 50%, #090514 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .gold-border {
            border: 2px solid #f39c12;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
        }

        .sun-gold-text {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .sun-panel {
            background: rgba(18, 12, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(243, 156, 18, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .dice-box {
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #000;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.6);
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-3deg); }
            40% { transform: translate(1px, -1px) rotate(2deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6">

    <!-- Header Sunwin Style -->
    <header class="max-w-6xl w-full mx-auto flex justify-between items-center sun-panel p-4 rounded-xl gold-border mb-4">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-gradient-to-tr from-yellow-500 to-amber-600 rounded-xl flex items-center justify-center font-black text-2xl shadow-lg border border-yellow-300">👑</div>
            <span class="text-3xl font-black tracking-wider sun-gold-text">SUNVIP88</span>
        </div>
        <div class="flex items-center space-x-3">
            <div class="px-4 py-2 bg-black/60 border border-yellow-500/40 rounded-xl text-sm font-semibold">
                ID: <span class="text-yellow-400">BossMan_99</span> | Dư: <span id="balance" class="text-yellow-400 font-bold">50,000,000</span> VNĐ
            </div>
            <button onclick="openCashModal()" class="px-5 py-2.5 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-black font-black rounded-xl transition shadow-lg text-sm border border-yellow-200">NẠP / RÚT</button>
        </div>
    </header>

    <!-- Main Casino Lobby / Tai Xiu -->
    <main class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-4 gap-4 flex-grow items-center">
        
        <!-- Left Stats -->
        <div class="sun-panel p-4 rounded-xl h-[420px] flex flex-col">
            <h3 class="text-sm font-bold text-yellow-400 mb-3 border-b border-yellow-500/20 pb-2">THỐNG KÊ PHIÊN</h3>
            <div class="space-y-2 overflow-y-auto flex-grow pr-1">
                <div class="flex justify-between items-center p-2.5 bg-black/40 rounded-lg text-xs font-bold border border-yellow-500/10">
                    <span class="text-yellow-500">#99281</span>
                    <span class="text-red-400">Tài (15 Điểm)</span>
                </div>
                <div class="flex justify-between items-center p-2.5 bg-black/40 rounded-lg text-xs font-bold border border-yellow-500/10">
                    <span class="text-yellow-500">#99280</span>
                    <span class="text-blue-400">Xỉu (8 Điểm)</span>
                </div>
            </div>
        </div>

        <!-- Center Arena (Bat Dia & Dice Bowl) -->
        <div class="sun-panel p-6 rounded-xl h-[420px] flex flex-col items-center justify-between col-span-2 relative gold-border">
            <div class="absolute top-3 flex items-center space-x-2">
                <span class="text-xs uppercase tracking-widest text-yellow-300">Phiên #99282</span>
                <span id="countdown" class="text-xl font-black text-red-500">20s</span>
            </div>

            <!-- Dice Bowl Display -->
            <div id="bowl-container" class="relative my-auto flex space-x-4">
                <div id="d1" class="dice-box">?</div>
                <div id="d2" class="dice-box">?</div>
                <div id="d3" class="dice-box">?</div>
            </div>

            <div id="result-announcement" class="text-xl font-black sun-gold-text tracking-wide text-center">ĐANG MỞ CƯỢC... HÃY ĐẶT CỬA!</div>
        </div>

        <!-- Right Quick Bet History -->
        <div class="sun-panel p-4 rounded-xl h-[420px] flex flex-col">
            <h3 class="text-sm font-bold text-yellow-400 mb-3 border-b border-yellow-500/20 pb-2">LỊCH SỬ CƯỢC</h3>
            <div id="my-bets" class="space-y-2 overflow-y-auto flex-grow text-xs text-gray-300">
                <div class="p-2 bg-black/40 rounded-lg">Chưa có cược trong phiên này.</div>
            </div>
        </div>

    </main>

    <!-- Betting Controls Bar -->
    <div class="max-w-6xl w-full mx-auto mt-4 sun-panel p-4 rounded-xl grid grid-cols-1 md:grid-cols-3 gap-4 items-center gold-border">
        <div class="flex flex-col">
            <label class="text-xs text-yellow-400 mb-1 font-semibold">Mức tiền cược (VNĐ)</label>
            <input type="number" id="bet-input" value="500000" class="bg-black/60 border border-yellow-500/40 rounded-xl px-4 py-2.5 text-yellow-300 font-bold focus:outline-none focus:border-yellow-400">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="placeBet('TAI')" class="py-4 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 rounded-xl font-black text-2xl text-white shadow-lg border border-red-400 transition transform active:scale-95">TÀI</button>
            <button onclick="placeBet('XIU')" class="py-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 rounded-xl font-black text-2xl text-white shadow-lg border border-blue-400 transition transform active:scale-95">XỈU</button>
        </div>
        <div class="flex justify-around bg-black/40 p-2 rounded-xl border border-yellow-500/20">
            <button onclick="addChip(100000)" class="px-3 py-1 bg-yellow-600/30 hover:bg-yellow-600/50 rounded-lg text-xs font-bold text-yellow-300">+100K</button>
            <button onclick="addChip(500000)" class="px-3 py-1 bg-yellow-600/30 hover:bg-yellow-600/50 rounded-lg text-xs font-bold text-yellow-300">+500K</button>
            <button onclick="addChip(1000000)" class="px-3 py-1 bg-yellow-600/30 hover:bg-yellow-600/50 rounded-lg text-xs font-bold text-yellow-300">+1M</button>
            <button onclick="addChip(5000000)" class="px-3 py-1 bg-yellow-600/30 hover:bg-yellow-600/50 rounded-lg text-xs font-bold text-yellow-300">+5M</button>
        </div>
    </div>

    <!-- Modal Cashier Sunwin Style -->
    <div id="cash-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="sun-panel max-w-md w-full p-6 rounded-2xl gold-border relative">
            <h2 class="text-2xl font-black sun-gold-text mb-4">GIAO DỊCH NẠP / RÚT / THẺ CÀO</h2>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-yellow-400 mb-1 block">Hình thức</label>
                    <select class="w-full bg-black/60 border border-yellow-500/40 rounded-xl px-4 py-3 text-yellow-300 font-bold focus:outline-none">
                        <option>Rút tiền Ngân hàng (Vietcombank, Techcombank, MB...)</option>
                        <option>Đổi Thẻ Cào Điện Thoại (Viettel, Vina, Mobi)</option>
                        <option>Nạp tiền tự động (Auto Banking)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-yellow-400 mb-1 block">Số tiền / Mệnh giá</label>
                    <input type="number" placeholder="Nhập số tiền muốn giao dịch..." class="w-full bg-black/60 border border-yellow-500/40 rounded-xl px-4 py-3 text-yellow-300 font-bold focus:outline-none">
                </div>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeCashModal()" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold transition">ĐÓNG</button>
                <button onclick="executeTransaction()" class="flex-1 py-3 bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-black rounded-xl hover:from-yellow-400 hover:to-amber-500 transition shadow-lg">XÁC NHẬN</button>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let balance = 50000000;
        let currentBetChoice = null;

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString('en-US');
        }

        function openCashModal() {
            document.getElementById('cash-modal').classList.remove('hidden');
            document.getElementById('cash-modal').classList.add('flex');
        }

        function closeCashModal() {
            document.getElementById('cash-modal').classList.add('hidden');
            document.getElementById('cash-modal').classList.remove('flex');
        }

        function executeTransaction() {
            alert("Lệnh giao dịch đã được hệ thống SunVIP88 ghi nhận và xử lý tự động trong tích tắc!");
            closeCashModal();
        }

        function addChip(val) {
            let input = document.getElementById('bet-input');
            input.value = parseInt(input.value) + val;
        }

        function placeBet(type) {
            let amount = parseInt(document.getElementById('bet-input').value);
            if (amount > balance) {
                alert("Số dư tài khoản không đủ để cược mức này!");
                return;
            }
            balance -= amount;
            updateUI();
            currentBetChoice = type;
            document.getElementById('result-announcement').innerText = `Đã đặt ${amount.toLocaleString()} VNĐ vào cửa ${type}`;
            document.getElementById('my-bets').innerHTML += `<div class="p-2 bg-black/40 rounded-lg text-yellow-400 font-bold">Cược ${amount.toLocaleString()} vào ${type}</div>`;
        }

        let timeLeft = 20;
        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 20;
                runDiceSimulation();
            }
            document.getElementById('countdown').innerText = timeLeft + 's';
        }, 1000);

        function runDiceSimulation() {
            document.getElementById('d1').classList.add('shaking');
            document.getElementById('d2').classList.add('shaking');
            document.getElementById('d3').classList.add('shaking');
            document.getElementById('result-announcement').innerText = "ĐANG LẮC XÚ CẢC...";

            setTimeout(() => {
                document.getElementById('d1').classList.remove('shaking');
                document.getElementById('d2').classList.remove('shaking');
                document.getElementById('d3').classList.remove('shaking');

                let v1 = Math.floor(Math.random() * 6) + 1;
                let v2 = Math.floor(Math.random() * 6) + 1;
                let v3 = Math.floor(Math.random() * 6) + 1;
                let sum = v1 + v2 + v3;
                let outcome = sum > 10 ? 'TÀI' : 'XỈU';

                document.getElementById('d1').innerText = v1;
                document.getElementById('d2').innerText = v2;
                document.getElementById('d3').innerText = v3;
                document.getElementById('result-announcement').innerText = `KẾT QUẢ: ${v1} - ${v2} - ${v3} (${sum} Điểm -> ${outcome})`;
            }, 1000);
        }
    </script>
</body>
</html>
